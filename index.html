<title>Covered in Grace Prep Recipes</title>

<style>
/* Layout: sticky espresso header, then either a grid of large recipe tiles (home) or a yield band + ingredients / steps columns (recipe). Tablet-first, one column on phones. */
:root {
  --bg: #FBF3E4;
  --surface: #FFFCF6;
  --fg: #2B1409;
  --muted: #5A3F2E;
  --line: #7A5A44;
  --head-bg: #3A1A0C;
  --head-fg: #FFF6E6;
  --tile-bg: #3A1A0C;
  --tile-fg: #FFF6E6;
  --tile-line: #3A1A0C;
  --gold: #F2B84B;
  --gold-fg: #2B1409;
  --gold-text: #8A4B0F;
  --done-bg: #E3EED8;
  --done-fg: #1D3610;
  --done-badge: #2F6B1E;
  --done-badge-fg: #FFFFFF;
  --focus: #0A4FCF;
  --font-display: "Alegreya", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", Verdana, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E0F08; --surface: #2C170E; --fg: #FBEFD9; --muted: #E0CBB0; --line: #A87B58;
    --head-bg: #120804; --head-fg: #FFF6E6; --tile-bg: #3B1E11; --tile-fg: #FFF6E6; --tile-line: #A87B58;
    --gold-text: #F2B84B; --done-bg: #22331A; --done-fg: #E2F3D2; --done-badge: #8FD16A; --done-badge-fg: #14250A;
    --focus: #FFD36B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E0F08; --surface: #2C170E; --fg: #FBEFD9; --muted: #E0CBB0; --line: #A87B58;
  --head-bg: #120804; --head-fg: #FFF6E6; --tile-bg: #3B1E11; --tile-fg: #FFF6E6; --tile-line: #A87B58;
  --gold-text: #F2B84B; --done-bg: #22331A; --done-fg: #E2F3D2; --done-badge: #8FD16A; --done-badge-fg: #14250A;
  --focus: #FFD36B; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 1.25rem; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--head-bg); z-index: 20;
}
:focus-visible { outline: 5px solid var(--focus); outline-offset: 3px; }
button, a { font: inherit; color: inherit; }
button { cursor: pointer; }

/* Header */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px));
  background: var(--head-bg); color: var(--head-fg);
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
  border-bottom: 4px solid var(--gold);
}
.logo { width: 76px; height: 76px; border-radius: 50%; flex: none; display: block; background: #FBF3E4; }
.brand { min-width: 0; flex: 1 1 14rem; }
.brand small { display: block; font-size: 1.05rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.brand h1, .bar h1 {
  margin: 0; font-family: var(--font-display); font-weight: 800; line-height: 1.05;
  font-size: clamp(2rem, 4.2vw, 3rem); text-wrap: balance;
}
.btn {
  min-height: 72px; min-width: 72px; padding: 0 28px; border-radius: 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  font-weight: 700; font-size: 1.5rem; text-decoration: none; border: 4px solid transparent;
}
.btn svg { width: 34px; height: 34px; flex: none; }
.btn-home { background: var(--gold); color: var(--gold-fg); }
.btn-ghost { background: transparent; color: var(--head-fg); border-color: var(--head-fg); font-size: 1.25rem; }
.bar .title { flex: 1 1 12rem; min-width: 0; }
.bar .title small { display: block; font-size: 1.05rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); font-weight: 700; }

main { max-width: 1280px; margin-inline: auto; padding-top: 28px; }

/* Home */
.lead { margin: 0 0 20px; font-size: 1.35rem; color: var(--muted); }
.grid { display: grid; gap: 24px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
.tile {
  display: flex; flex-direction: column; justify-content: space-between; gap: 24px;
  min-height: 240px; padding: 28px; border-radius: 24px; text-decoration: none;
  background: var(--tile-bg); color: var(--tile-fg); border: 4px solid var(--tile-line);
}
.tile .kicker { font-size: 1.1rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.tile h2 { margin: 6px 0 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(2.1rem, 3.6vw, 2.9rem); line-height: 1.05; text-wrap: balance; }
.tile .meta { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { font-size: 1.2rem; font-weight: 700; padding: 8px 16px; border-radius: 999px; border: 3px solid var(--gold); color: var(--tile-fg); }
.chip.progress { background: var(--gold); color: var(--gold-fg); }

/* Recipe */
.yield {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 20px;
  padding: 20px 24px; border-radius: 20px; background: var(--surface); border: 3px solid var(--line);
}
.yield .label { font-size: 1.1rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--gold-text); }
.yield .amount { font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 4vw, 2.75rem); line-height: 1.1; }
.allergen { margin-top: 16px; padding: 16px 24px; border-radius: 20px; border: 4px solid var(--fg); background: var(--gold); color: var(--gold-fg); font-size: 1.6rem; font-weight: 700; }
.switch { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
.seg { flex: 1 1 14rem; min-height: 72px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px 20px; border-radius: 16px; border: 4px solid var(--fg); background: var(--surface); color: var(--fg); font-size: 1.5rem; font-weight: 700; text-decoration: none; }
.seg[aria-current="page"] { background: var(--head-bg); color: var(--head-fg); border-color: var(--head-bg); box-shadow: inset 0 -8px 0 var(--gold); }

.check-box { margin-bottom: 20px; padding: 16px 22px; border-radius: 16px; border: 4px solid var(--fg); background: var(--gold); color: var(--gold-fg); font-size: 1.3rem; line-height: 1.4; }
.label-card { background: #fff; color: #000; border: 4px solid #000; border-radius: 6px; padding: 22px; font-family: "Atkinson Hyperlegible", Arial, Helvetica, sans-serif; }
.lbl-grid { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) { .lbl-grid { grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); } }
.label-card mark { background: #FFE066; color: #000; padding: 0 3px; border-radius: 3px; font-weight: 700; }
.nf { width: 100%; border: 2px solid #000; border-collapse: collapse; font-size: 1.15rem; line-height: 1.25; background: #fff; color: #000; }
.nf caption { text-align: left; font-weight: 800; font-size: 2.3rem; line-height: 1; padding: 6px 8px 4px; border: 2px solid #000; border-bottom: 0; background: #fff; }
.nf td { padding: 3px 8px; border-top: 1px solid #000; vertical-align: baseline; }
.nf td:last-child { text-align: right; white-space: nowrap; }
.nf .r { text-align: right; }
.nf .thin td { border-top: 0; font-weight: 400; }
.nf .thick-b td { border-top: 6px solid #000; }
.nf .cal td { border-top: 10px solid #000; }
.nf .calw { font-size: 1.9rem; font-weight: 800; }
.nf .calv { font-size: 2.6rem; font-weight: 800; line-height: 1; }
.nf .dvh td { border-top: 3px solid #000; }
.nf .ind td:first-child { padding-left: 24px; }
.nf .ind2 td:first-child { padding-left: 44px; }
.nf .nfoot td { border-top: 6px solid #000; font-size: 1rem; text-align: left; white-space: normal; }
.lbl-text { min-width: 0; font-size: 1.3rem; line-height: 1.45; }
.lbl-text p { margin: 0 0 14px; }
.lbl-brand { font-size: 1.05rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }
.lbl-name { margin: 4px 0 12px; font-family: "Alegreya", Georgia, serif; font-weight: 800; font-size: clamp(2rem, 4vw, 2.8rem); line-height: 1.05; }
.lbl-alg { border: 3px solid #000; padding: 10px 14px; font-size: 1.4rem; }

.menu-sec { margin-bottom: 36px; }
.sec-h { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 3.6vw, 2.6rem); line-height: 1.1; }
.sec-sub { margin: 4px 0 16px; font-size: 1.3rem; color: var(--muted); }
.chip.today { background: #FFFFFF; color: #2B1409; border-color: #FFFFFF; }
.tile-empty { background: transparent; color: var(--fg); border: 4px dashed var(--line); min-height: 200px; }
.tile-empty .kicker { color: var(--gold-text); }
.chip-empty { border-color: var(--line); color: var(--muted); }
.proposed { margin-top: 16px; padding: 14px 24px; border-radius: 20px; border: 4px dashed var(--fg); background: var(--surface); color: var(--fg); font-size: 1.5rem; font-weight: 700; }
.cols { display: grid; gap: 28px; margin-top: 28px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 960px) { .cols { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); } }
h2.sec {
  margin: 0 0 14px; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.9rem, 3.4vw, 2.5rem); line-height: 1.1;
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.count { font-family: var(--font-body); font-size: 1.3rem; font-weight: 700; color: var(--gold-text); }
.ing-group { background: var(--surface); border: 3px solid var(--line); border-radius: 20px; padding: 18px 22px; margin-bottom: 18px; }
.ing-group h3 { margin: 0 0 8px; font-size: 1.1rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-text); font-weight: 700; }
.ing-group ul { list-style: none; margin: 0; padding: 0; }
.ing-group li { display: grid; grid-template-columns: minmax(5.5rem, 7.5rem) minmax(0, 1fr); gap: 14px; padding: 10px 0; border-top: 2px solid color-mix(in srgb, var(--line) 35%, transparent); font-size: 1.4rem; line-height: 1.3; }
.ing-group li:first-child { border-top: 0; }
.ing-group .qty { font-weight: 700; font-variant-numeric: tabular-nums; }

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.step {
  width: 100%; min-height: 96px; display: flex; align-items: center; gap: 22px; text-align: left;
  padding: 18px 22px; border-radius: 20px; background: var(--surface); color: var(--fg); border: 4px solid var(--line);
}
.step .num {
  flex: none; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 700; font-size: 2rem; border: 4px solid var(--fg); background: transparent; font-variant-numeric: tabular-nums;
}
.step .num svg { width: 38px; height: 38px; display: none; }
.step .txt { min-width: 0; white-space: pre-line; font-weight: 700; font-size: clamp(1.6rem, 2.2vw + .8rem, 2.3rem); line-height: 1.25; }
.step[aria-checked="true"] { background: var(--done-bg); color: var(--done-fg); border-color: var(--done-badge); }
.step[aria-checked="true"] .num { background: var(--done-badge); border-color: var(--done-badge); color: var(--done-badge-fg); }
.step[aria-checked="true"] .num span { display: none; }
.step[aria-checked="true"] .num svg { display: block; }
.step[aria-checked="true"] .txt { text-decoration: line-through; text-decoration-thickness: 3px; }

.done-banner {
  margin-top: 20px; padding: 20px 24px; border-radius: 20px; background: var(--done-badge); color: var(--done-badge-fg);
  font-size: 1.8rem; font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;
}
.foot { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 16px; }
.foot .btn-ghost { color: var(--fg); border-color: var(--fg); }
.foot .btn-home { background: var(--head-bg); color: var(--head-fg); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) {
  .step, .tile, .btn { transition: background-color .15s, border-color .15s, transform .1s; }
  .step:active, .tile:active, .btn:active { transform: scale(.98); }
}
</style>
</head>

/* Label view: FDA-style Nutrition Facts per bottle, ingredient statement and allergen statement. Values are estimates. */
function gtxt(x) { return x === "<1" ? "less than 1g" : x + "g"; }
function esc(s) { return String(s).replace(/\[\[(.*?)\]\]/g, '<mark>$1</mark>'); }
function labelHTML(id) {
  var L = LABELS[id], base = find(id);
  var P = L.pct;
  function row(cls, label, val, pc) {
    return '<tr class="' + cls + '"><td><b>' + label + "</b> " + val + "</td><td>" + (pc === undefined ? "" : "<b>" + pc + "%</b>") + "</td></tr>";
  }
  function mic(label, val, pc) { return "<tr><td>" + label + " " + val + "</td><td>" + pc + "%</td></tr>"; }
  var nf =
    '<table class="nf"><caption>Nutrition Facts</caption><tbody>' +
    '<tr class="thin"><td colspan="2">1 serving per container</td></tr>' +
    '<tr class="thick-b"><td><b>Serving size</b></td><td class="r"><b>1 bottle (16 fl oz)</b></td></tr>' +
    '<tr class="cal"><td><small>Amount per serving</small><br><span class="calw">Calories</span></td><td class="r"><span class="calv">' + L.cal + "</span></td></tr>" +
    '<tr class="dvh"><td colspan="2" class="r"><b>% Daily Value*</b></td></tr>' +
    row("", "Total Fat", gtxt(L.fat), P.fat) +
    row("ind", "Saturated Fat", gtxt(L.sat), P.sat) +
    '<tr class="ind"><td><i>Trans</i> Fat 0g</td><td></td></tr>' +
    row("", "Cholesterol", L.chol + "mg", P.chol) +
    row("", "Sodium", L.na + "mg", P.na) +
    row("", "Total Carbohydrate", gtxt(L.carb), P.carb) +
    row("ind", "Dietary Fiber", gtxt(L.fiber), P.fiber) +
    '<tr class="ind"><td><b>Total Sugars</b> ' + gtxt(L.sug) + "</td><td></td></tr>" +
    row("ind2", "Includes " + gtxt(L.add) + " Added Sugars", "", P.add).replace("<b>Includes", "Includes").replace("Added Sugars</b>", "Added Sugars") +
    '<tr class="thick-b"><td><b>Protein</b> ' + gtxt(L.pro) + "</td><td></td></tr>" +
    mic("Vitamin D", L.vitd + "mcg", P.vitd) + mic("Calcium", L.ca + "mg", P.ca) + mic("Iron", L.fe + "mg", P.fe) + mic("Potassium", L.k + "mg", P.k) +
    '<tr class="nfoot"><td colspan="2">* The % Daily Value (DV) tells you how much a nutrient in a serving of food contributes to a daily diet. 2,000 calories a day is used for general nutrition advice.</td></tr>' +
    "</tbody></table>";
  return '<div class="label-card"><div class="lbl-grid"><div>' + nf + '</div><div class="lbl-text">' +
    '<div class="lbl-brand">Covered in Grace Beverage Co.</div>' +
    '<h2 class="lbl-name">' + base.name + "</h2>" +
    '<p class="lbl-net"><b>Net contents:</b> 16 fl oz bottle</p>' +
    '<p class="lbl-ing"><b>INGREDIENTS:</b> ' + esc(L.ing) + "</p>" +
    '<p class="lbl-alg"><b>CONTAINS:</b> ' + L.alg.toUpperCase() + (L.may ? '<br><b>MAY CONTAIN:</b> ' + L.may.toUpperCase() : "") + "</p>" +
    '<p class="lbl-ref"><b>KEEP REFRIGERATED.</b> Shake well. Foam may settle.</p>' +
    '<p class="lbl-co">Covered in Grace Beverage Co., ' + esc("Jefferson, GA") + "</p>" +
    "</div></div></div>";
}

function renderLabel(r) {
  document.title = r.name + " Bottle Label";
  var todo = (LABELS[r.base].ing.match(/\[\[/g) || []).length;
  app.innerHTML =
    '<header class="bar"><a class="btn btn-home" href="#bottled">' + ICON_HOME + 'Home</a>' +
    '<div class="title"><small>Bottle label</small><h1>' + r.name + '</h1></div>' +
    '<img class="logo" src="' + LOGO + '" alt="Covered in Grace Beverage Co. logo"></header>' +
    "<main>" +
    '<div class="switch"><a class="seg" href="#' + r.base + '-bottled">Back to the recipe</a></div>' +
    '<div class="check-box" role="note"><b>Check before printing.</b> Nutrition numbers are estimates added up from product labels and standard values, not lab results. ' +
    (todo ? "Highlighted text is missing a product&rsquo;s ingredient list. " : "") +
    'Sauce, syrup and vanilla paste details come from your product labels. Confirm the allergen line against every product you use. Net contents assume a full 16 fl oz bottle.</div>' +
    labelHTML(r.base) +
    '<div class="foot"><a class="btn btn-home" href="#bottled">' + ICON_HOME + "Home</a></div></main>";
  window.scrollTo(0, 0);
}

function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return;
    var d = JSON.parse(raw);
    if (d && d.t && Date.now() - d.t < 4 * 3600 * 1000 && d.c) checks = d.c;
  } catch (e) {}
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ t: Date.now(), c: checks })); } catch (e) {}
}
function done(r) { return (checks[r.id] || []).length; }
function find(id) { for (var i = 0; i < RECIPES.length; i++) if (RECIPES[i].id === id) return RECIPES[i]; return null; }

/* The bottled version of a recipe shares its name, line and allergens; amounts and steps come from BOTTLED. */
function get(r, bottled) {
  if (!bottled) return r;
  var v = BOTTLED[r.id];
  return { id: r.id + "-bottled", base: r.id, bottled: true, name: r.name, line: v.line || r.line + " · Bottled", makes: v.makes, allergens: r.allergens, groups: v.groups, steps: v.steps, proposed: r.proposed, note: r.note };
}

function menuTile(it, bottled, today) {
  var kicker = it.day ? it.day + " · " + it.blessing : it.kicker;
  var badge = it.dow === today ? '<span class="chip today">Today</span>' : "";
  var base = it.id ? find(it.id) : null;
  if (!base || (bottled && !base.cupOnly && !BOTTLED[base.id])) {
    return '<div class="tile tile-empty"><div><div class="kicker">' + kicker + "</div><h2>" + it.name + '</h2></div>' +
      '<div class="meta">' + badge + '<span class="chip chip-empty">Recipe not added yet</span></div></div>';
  }
  var r = base.cupOnly ? base : get(base, bottled);
  var d = done(r);
  var flag = (base.cupOnly ? '<span class="chip">Cup only</span>' : "") + (r.proposed ? '<span class="chip">Proposed</span>' : "");
  var prog = d > 0 ? '<span class="chip progress">' + (d === r.steps.length ? "All steps done" : d + " of " + r.steps.length + " steps done") + "</span>" : "";

}

function renderHome(bottled) {
  document.title = "Covered in Grace Prep Recipes";
  var today = new Date().getDay();
  var sections = MENU.map(function (s) {
    return '<section class="menu-sec"><h2 class="sec-h">' + s.title + '</h2><p class="sec-sub">' + s.sub + '</p><div class="grid">' +
      s.items.map(function (it) { return menuTile(it, bottled, today); }).join("") + "</div></section>";
  }).join("");
  app.innerHTML =
    '<header class="bar"><img class="logo" src="' + LOGO + '" alt="Covered in Grace Beverage Co. logo">' +
    '<div class="brand"><small>Covered in Grace Beverage Co.</small><h1>Prep Recipes</h1></div></header>' +
    '<main>' + switcher(bottled ? "bottled" : "cup", "#cup", "#bottled") + sections + "</main>";
  window.scrollTo(0, 0);
}

function renderRecipe(r) {
  document.title = r.name + (r.bottled ? " Bottled Prep" : " Prep");
  var home = r.bottled ? "#bottled" : "#cup";
  var other = r.bottled ? "#" + r.base : "#" + r.id + "-bottled";
  var groups = r.groups.map(function (g) {
    return '<section class="ing-group"><h3>' + g.title + "</h3><ul>" +
      g.items.map(function (i) { return '<li><span class="qty">' + i[0] + "</span><span>" + i[1] + "</span></li>"; }).join("") +
      "</ul></section>";
  }).join("");
  var steps = r.steps.map(function (s, i) {
    return '<li><button type="button" class="step" role="checkbox" aria-checked="false" data-i="' + i + '">' +
      '<span class="num"><span>' + (i + 1) + "</span>" + ICON_CHECK + '</span><span class="txt">' + s + "</span></button></li>";
  }).join("");
  app.innerHTML =
    '<header class="bar"><a class="btn btn-home" href="' + home + '">' + ICON_HOME + 'Home</a>' +
    '<div class="title"><small>' + r.line + "</small><h1>" + r.name + '</h1></div>' +
    '<img class="logo" src="' + LOGO + '" alt="Covered in Grace Beverage Co. logo"></header>' +
    "<main>" + (r.cupOnly ? "" : switcher(r.bottled ? "bottled" : "cup", "#" + (r.bottled ? r.base : r.id), "#" + (r.bottled ? r.id : r.id + "-bottled"))) +
    (r.bottled && LABELS[r.base] ? '<div class="switch"><a class="seg" href="#' + r.base + '-label">Bottle label: ingredients, allergens, nutrition</a></div>' : "") +
    '<div class="yield"><span class="label">One batch makes</span><span class="amount">' + r.makes + "</span></div>" +
    (r.proposed ? '<div class="proposed" role="note"><strong>Proposed recipe.</strong> Test before service.</div>' : "") +
    (r.note ? '<div class="proposed" role="note">' + r.note + "</div>" : "") +
    (r.allergens ? '<div class="allergen" role="note"><strong>Allergens:</strong> ' + r.allergens + "</div>" : "") +
    '<div class="cols"><div><h2 class="sec">Ingredients</h2>' + groups + "</div>" +
    '<div><h2 class="sec">Steps <span class="count" id="count"></span></h2><ol class="steps" id="steps">' + steps + "</ol>" +
    '<div class="done-banner" id="banner" hidden><span>All steps done.</span><a class="btn btn-home" href="' + home + '">' + ICON_HOME + "Home</a></div></div></div>" +
    '<div class="foot"><a class="btn btn-home" href="' + home + '">' + ICON_HOME + 'Home</a>' +
    '<button type="button" class="btn btn-ghost" id="reset">' + ICON_RESET + "Start over</button></div></main>";
  paint(r);
  window.scrollTo(0, 0);
}

function paint(r) {
  var set = checks[r.id] || [];
  var btns = app.querySelectorAll(".step");
  for (var i = 0; i < btns.length; i++) btns[i].setAttribute("aria-checked", set.indexOf(i) > -1 ? "true" : "false");
  var c = document.getElementById("count");
  if (c) c.textContent = set.length + " of " + r.steps.length + " done";
  var b = document.getElementById("banner");
  if (b) b.hidden = set.length !== r.steps.length;
}

var current = null;
function route() {
  var id = (location.hash || "").replace("#", "");
  var lab = /-label$/.test(id);
  if (lab) {
    var lb = find(id.replace(/-label$/, ""));
    if (lb && LABELS[lb.id]) { current = null; renderLabel(get(lb, true)); return; }
  }
  var bottled = /-bottled$/.test(id);
  var base = find(bottled ? id.replace(/-bottled$/, "") : id);
  current = base && (!bottled || BOTTLED[base.id]) ? get(base, bottled) : null;
  if (current) renderRecipe(current); else renderHome(id !== "cup");
}

app.addEventListener("click", function (e) {
  if (!current) return;
  var step = e.target.closest(".step");
  if (step) {
    var i = Number(step.getAttribute("data-i"));
    var set = checks[current.id] || (checks[current.id] = []);
    var at = set.indexOf(i);
    if (at > -1) set.splice(at, 1); else set.push(i);
    save(); paint(current);
    if (set.length === current.steps.length) live.textContent = "All steps done.";
    return;
  }
  if (e.target.closest("#reset")) {
    checks[current.id] = []; save(); paint(current);
    live.textContent = "Steps cleared.";
  }
});

window.addEventListener("hashchange", route);
load(); route();

/* Keep the tablet awake while someone is prepping. */
function keepAwake() {
  try { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(function () {}); } catch (e) {}
}
keepAwake();
document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") keepAwake(); });
</script>
<script>
/* Lets the iPad reopen the page when the Wi-Fi is spotty. */
if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }
</script>
</body>
